name: Desktop beta release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:test
      - run: pnpm build
      - run: pnpm e2e
      - run: xvfb-run -a pnpm --filter @nightthread/desktop e2e
      - run: pnpm exec opennextjs-cloudflare build
      - run: pnpm exec wrangler deploy --dry-run

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    env:
      NIGHTTHREAD_WEB_ORIGIN: ${{ vars.NIGHTTHREAD_WEB_ORIGIN }}
      CSC_LINK: ${{ matrix.artifact == 'macos' && secrets.MACOS_CERTIFICATE_P12 || secrets.WINDOWS_CERTIFICATE_PFX }}
      CSC_KEY_PASSWORD: ${{ matrix.artifact == 'macos' && secrets.MACOS_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Apple notarization key
        if: matrix.artifact == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Set desktop version from tag
        shell: bash
        run: node apps/desktop/scripts/set-version.mjs "${GITHUB_REF_NAME#desktop-v}"
      - run: pnpm desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: nightthread-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
